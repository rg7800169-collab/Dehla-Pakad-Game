<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehla Pakad - Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col font-sans overflow-hidden">
    
    <!-- Lobby Screen -->
    <div id="lobby" class="absolute inset-0 bg-gray-900 flex flex-col justify-center items-center z-50">
        <h1 class="text-5xl font-bold text-yellow-400 mb-4">Dehla Pakad (Multiplayer)</h1>
        <p class="text-2xl text-gray-300">Apne dosto ko yeh link bhejein...</p>
        <p class="text-3xl font-bold mt-6 text-green-400"><span id="player-count">1</span> / 4 Players Joined</p>
    </div>

    <!-- Top Scoreboard -->
    <div class="bg-gray-800 border-b-4 border-green-700 p-4 shadow-lg flex justify-between items-center z-10">
        <div class="flex-1 text-center border-r border-gray-600">
            <h3 class="text-sm text-gray-400 uppercase tracking-widest">Team A</h3>
            <p class="text-xl font-bold text-blue-400">Dehlas: <span id="team-a-dehlas">0</span> | Cards: <span id="team-a-cards">0</span></p>
        </div>
        <div class="flex-1 text-center">
            <h3 class="text-sm text-gray-400 uppercase tracking-widest">Hukum</h3>
            <div id="hukum-badge" class="inline-block mt-1 px-4 py-1 rounded-full bg-gray-700 font-bold transition-all"><span id="hukum-suit">🔒 Hidden</span></div>
        </div>
        <div class="flex-1 text-center border-l border-gray-600">
            <h3 class="text-sm text-gray-400 uppercase tracking-widest">Team B</h3>
            <p class="text-xl font-bold text-red-400">Dehlas: <span id="team-b-dehlas">0</span> | Cards: <span id="team-b-cards">0</span></p>
        </div>
    </div>

    <!-- Table -->
    <div class="flex-1 flex justify-center items-center p-4 relative">
        <div id="status-alert" class="absolute top-4 bg-blue-600 text-white px-6 py-2 rounded-full shadow-lg font-semibold z-20 transition">Game shuru hone ka intezaar hai...</div>
        <div class="game-table shadow-2xl flex justify-center items-center relative">
            <div id="center-play-area" class="w-64 h-64 relative flex justify-center items-center"></div>
        </div>
    </div>

    <!-- Your Hand -->
    <div class="bg-gray-800 p-4 shadow-[0_-10px_20px_rgba(0,0,0,0.5)] z-10">
        <div class="text-center mb-2 text-yellow-400 font-bold tracking-wider uppercase text-sm">Aapki Cards</div>
        <div id="my-hand" class="flex justify-center gap-2 overflow-x-auto pb-4 custom-scrollbar"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
